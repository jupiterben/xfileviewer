[package]
name = "xfileviewer"
version = "0.1.2"
description = "Kind + Viewer desktop file opener"
authors = ["you"]
edition = "2021"

[lib]
name = "xfileviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

