[package]
name = "xfileviewer"
version = "0.1.10"
description = "Kind + Viewer desktop file opener"
authors = ["you"]
edition = "2021"

[lib]
name = "xfileviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates the multiview APIs (Window::add_child) used by the
# transparent video overlay webview (see video_overlay.rs). Windows-only
# feature; on Linux the code paths are compiled out but the flag is inert.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming", "Win32_Graphics_Gdi"] }
# COM-backed IDropTarget forwarding: version/features must stay compatible with
# the copy wry pulls into the tree (see video_drop.rs). `implement` is always
# available since windows-core unconditionally re-exports it.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
] }
# Direct dep so the `#[implement]` macro's emitted `windows_core::` paths resolve.
windows-core = "0.61"
